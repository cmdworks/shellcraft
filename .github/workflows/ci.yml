name: ci

# Builds run only when a version tag is pushed (vX.Y.Z), never on ordinary pushes or pull requests.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: shells for the tests that drive real shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: minimal build
        run: cargo clippy -p shellcraft --no-default-features --all-targets -- -D warnings

  sweep:
    name: real-shell sweep (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    # new on Linux and never run there before: report, do not block, until it has been green once
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: [zsh, bash, fish]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: shells
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y zsh fish; else brew install fish; fi
      - run: python3 scripts/sweep/run.py ${{ matrix.shell }}
