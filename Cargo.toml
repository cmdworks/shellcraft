[workspace]
resolver = "2"
members = ["core", "platform", "plugin-host", "bundled/*", "shells/*", "features/*", "cli"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
clap_complete = "4.5.67"
criterion = "0.7.0"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
flate2 = "1.1.11"
ignore = "0.4.30"
insta = "1.49.0"
minijinja = { version = "3.1.0", default-features = false, features = ["builtins", "multi_template", "serde"] }
nucleo-matcher = "0.3.1"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.0.7"
ureq = "3.2.1"

# first-party crates
shellcraft-core = { path = "core" }
shellcraft-platform = { path = "platform" }
shellcraft-plugin = { path = "plugin-host" }
shellcraft-bundled = { path = "bundled/all" }
shellcraft-bundled-official = { path = "bundled/official" }
shellcraft-bundled-git = { path = "bundled/git" }
shellcraft-bundled-versions = { path = "bundled/versions" }
shellcraft-shell-api = { path = "shells/api" }
shellcraft-shell = { path = "shells/all" }
shellcraft-shell-zsh = { path = "shells/zsh" }
shellcraft-shell-bash = { path = "shells/bash" }
shellcraft-shell-fish = { path = "shells/fish" }
shellcraft-shell-nushell = { path = "shells/nushell" }
shellcraft-shell-pwsh = { path = "shells/pwsh" }
shellcraft-jump = { path = "features/jump" }
shellcraft-history = { path = "features/history" }
shellcraft-prompt = { path = "features/prompt" }
shellcraft-complete = { path = "features/complete" }
shellcraft-not-found = { path = "features/not-found" }
shellcraft-coreutils = { path = "features/coreutils" }
shellcraft-picker = { path = "features/picker" }
shellcraft-plugins-cli = { path = "features/plugins-cli" }
shellcraft-installer = { path = "features/installer" }
shellcraft-health = { path = "features/health" }
shellcraft-profile = { path = "features/profile" }
shellcraft-tui = { path = "features/tui" }

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
